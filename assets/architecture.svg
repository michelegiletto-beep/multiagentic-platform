    <g font-size="14" fill="#a3b1bd"><text x="62" y="477">Integration code present</text><text x="62" y="505">Disabled in this NATIVE_ONLY build</text><text x="62" y="533">Activation needs build-specific evaluation</text><text x="456" y="477">Datasets, campaigns and replay</text><text x="456" y="505">Baselines, temporal validation and stress</text><text x="456" y="533">Evidence before candidate promotion</text><text x="868" y="477">Memory and I/O budgets</text><text x="868" y="505">Numerical fidelity and latency</text><text x="868" y="533">Research RFC; runtime not established</text></g>
